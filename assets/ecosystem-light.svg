<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="NixOS to Android Ecosystem">
  <rect width="900" height="220" rx="28" fill="#fff8f5" stroke="#d8c2b7" stroke-width="1.5"/>

  <!-- Top bridge bar -->
  <rect x="28" y="22" width="240" height="44" rx="18" fill="#ffdbcb" stroke="#d8c2b7"/>
  <text x="148" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#341100">NixOS 26.11 Host</text>
  <text x="148" y="57" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#53433b">Hyprland · Quickshell · Rust</text>

  <line x1="274" y1="44" x2="626" y2="44" stroke="#9c4110" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="336" y="29" width="228" height="30" rx="15" fill="#f7ebe4" stroke="#d8c2b7"/>
  <text x="450" y="48" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700" fill="#9c4110">LAN / USB / Tailscale (tailscale0)</text>

  <rect x="632" y="22" width="240" height="44" rx="18" fill="#efe58c" stroke="#d8c2b7"/>
  <text x="752" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1f1c00">Android (Pixel 9a)</text>
  <text x="752" y="57" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#53433b">120Hz OLED · 3DoF · KMP</text>

  <!-- 4 Pillar Cards -->
  <rect x="28" y="84" width="198" height="112" rx="22" fill="#fdf1eb" stroke="#d8c2b7"/>
  <text x="44" y="110" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#9c4110">DISPLAY &amp; VR</text>
  <text x="44" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#231915">VRCast 3DoF</text>
  <text x="44" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">Hyprland UV-Atlas +</text>
  <text x="44" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">OpenGL ES 3.0 @ 120Hz</text>

  <rect x="242" y="84" width="198" height="112" rx="22" fill="#fdf1eb" stroke="#d8c2b7"/>
  <text x="258" y="110" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#9c4110">AUDIO BRIDGE</text>
  <text x="258" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#231915">SoundDrift</text>
  <text x="258" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">Low-latency bidirectional</text>
  <text x="258" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">audio (Kotlin + Rust)</text>

  <rect x="456" y="84" width="198" height="112" rx="22" fill="#fdf1eb" stroke="#d8c2b7"/>
  <text x="472" y="110" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#9c4110">FILE TRANSFER</text>
  <text x="472" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#231915">Share (Compartir)</text>
  <text x="472" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">Rust Tokio daemon +</text>
  <text x="472" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">Nautilus &amp; Android SAF</text>

  <rect x="670" y="84" width="202" height="112" rx="22" fill="#fdf1eb" stroke="#d8c2b7"/>
  <text x="686" y="110" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#9c4110">OS-WIDE AI</text>
  <text x="686" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#231915">Agi Desktop Orbs</text>
  <text x="686" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">Quickshell QML +</text>
  <text x="686" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#53433b">Nautilus file assistant</text>
